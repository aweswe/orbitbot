name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        run: |
          mkdir -p /tmp/scan
          git archive --format=tar HEAD | tar -x -C /tmp/scan
          docker run --rm -v /tmp/scan:/scan zricethezav/gitleaks:v8.18.4 \
            detect --source /scan --no-git --redact \
            --config /scan/.gitleaks.toml --verbose
